services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on: [postgres]
  runtime:
    build: .
    command: ["python", "scripts/runtime.py"]
    env_file: .env
    restart: unless-stopped
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: rros_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - rros_pg:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  rros_pg:
